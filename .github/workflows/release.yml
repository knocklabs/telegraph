name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # npm's trusted publisher config does not check the branch, so publishing is
    # gated on this environment instead. Its deployment branch policy allows only
    # main, and each npm trusted publisher requires the same environment name.
    environment: production-release
    permissions:
      contents: read
      id-token: write # Yarn authenticates to npm through OIDC and signs provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          cache: "yarn"
      - name: Install Dependencies
        run: yarn --immutable
      - name: Build packages
        run: yarn build:packages
      # Publishing authenticates through npm trusted publishing, so no npm token
      # is configured. Yarn uses `npmAuthToken` ahead of OIDC when one is set.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.KNOCK_ENG_BOT_GITHUB_TOKEN }}
          commit-message: "chore(repo): version packages"
          pr-title: "chore(repo): version packages"
          version-script: yarn changeset version
          publish-script: yarn release
