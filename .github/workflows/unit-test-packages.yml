name: Unit Test Packages

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: unit-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
   unit-test-packages:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout
         uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         with:
           persist-credentials: false
       - name: Setup Node
         uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
         with:
          node-version-file: "package.json"
          cache: 'yarn'
       - name: Cache Build
         id: build-packages-cache
         uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
         with:
           path: |
             **/dist
           key: build:packages-${{ hashFiles('packages') }}
       - name: Install Dependencies
         run: yarn --immutable
       - name: Build Packages
         if: steps.build-packages-cache.outputs.cache-hit != 'true'
         run: yarn build:packages
       - name: Run Tests
         run: yarn test
       # TODO: Collect Coverage and display in repo

