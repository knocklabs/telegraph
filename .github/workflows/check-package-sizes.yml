name: Check Package Sizes

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-package-sizes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-package-sizes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          cache: "yarn"
      - name: Install Dependencies
        run: yarn --immutable
      - name: Build Current Branch
        run: yarn build:packages
      # These local actions import @actions/core from the workspace's
      # node_modules. A `$/` reference runs them from the runner's action cache,
      # where that import can't resolve, so they stay workspace-relative.
      - name: Get Current Package Sizes
        uses: ./.github/actions/check-package-sizes-action # zizmor: ignore[self-repository]
        id: current-package-sizes
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Install Dependencies
        run: YARN_ENABLE_HARDENED_MODE=0 yarn install --no-immutable
      - name: Build Main Branch
        run: yarn build:packages
      - name: Get Main Package Sizes
        uses: ./.github/actions/check-package-sizes-action # zizmor: ignore[self-repository]
        id: main-package-sizes
      - name: Compare Package Sizes
        uses: ./.github/actions/compare-package-sizes-action # zizmor: ignore[self-repository]
        with:
          current-package-sizes: ${{ steps.current-package-sizes.outputs.package-sizes }}
          previous-package-sizes: ${{ steps.main-package-sizes.outputs.package-sizes }}
        id: compare-package-sizes
      - name: Find Comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          token: ${{ secrets.KNOCK_ENG_BOT_GITHUB_TOKEN }} 
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "knock-eng-bot"
          body-includes: ### Package size differences
      - name: Create comment
        if: steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.KNOCK_ENG_BOT_GITHUB_TOKEN }} 
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.compare-package-sizes.outputs.pr-comment }}
      - name: Update comment
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.KNOCK_ENG_BOT_GITHUB_TOKEN }} 
          comment-id: ${{ steps.fc.outputs.comment-id }}
          body: ${{ steps.compare-package-sizes.outputs.pr-comment }}
          edit-mode: replace
