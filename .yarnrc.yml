nodeLinker: node-modules
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Harden install scripts against supply-chain attacks (KNO-13807).
# Build/postinstall scripts are the primary execution vector for npm supply
# chain attacks, so they are disabled by default. The packages that genuinely
# need to compile or download a binary at install time are allow-listed via
# `dependenciesMeta.<pkg>.built: true` in package.json.
enableScripts: false

# Yarn 4.15 made a one-day minimum release age the default. Keep resolving
# brand-new versions, as Yarn did before that release.
npmMinimalAgeGate: 0

# Releases publish from GitHub Actions through npm trusted publishing (OIDC),
# see .github/workflows/release.yml. Publish to npmjs.org directly rather than
# Yarn's default registry.yarnpkg.com alias. Provenance is requested by the
# `release:publish` script rather than here, because Yarn fails to generate it
# outside CI and that would break local `yarn npm publish --dry-run`.
npmPublishRegistry: "https://registry.npmjs.org"
